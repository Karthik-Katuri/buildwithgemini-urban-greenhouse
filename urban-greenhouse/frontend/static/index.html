<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Greenhouse</title>
<!-- Optional: used only to draw A2UI Icon components. If it can't load (offline/
     corp network), icons fall back to showing their name as text. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #2e7d32;
    --accent-light: #4caf50;
    --accent-hover: #1b5e20;
    --bg: #f4f7f4;
    --border: #d4e3d4;
    --user-bubble-bg: #2e7d32;
    --user-bubble-color: #ffffff;
    --agent-bubble-bg: #ffffff;
    --agent-bubble-border: #d8e5d8;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -1px rgba(0,0,0,0.04);
  }
  * { box-sizing:border-box; }
  body {
    margin:0;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    height:100vh;
  }
  header {
    background:var(--accent);
    color:#fff;
    padding:.9rem 1.4rem;
    font-weight:700;
    font-size:1.15rem;
    display:flex;
    align-items:center;
    gap:.6rem;
    box-shadow:var(--shadow-sm);
    letter-spacing:0.2px;
  }
  #log {
    flex:1;
    overflow-y:auto;
    padding:1.4rem 1.2rem;
    max-width:820px;
    width:100%;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:1rem;
  }
  .msg-row {
    display:flex;
    gap:.75rem;
    align-items:flex-start;
    max-width:85%;
  }
  .msg-row.user {
    align-self:flex-end;
    flex-direction:row-reverse;
  }
  .msg-row.agent {
    align-self:flex-start;
  }
  .avatar {
    width:36px;
    height:36px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.15rem;
    flex-shrink:0;
    box-shadow:var(--shadow-sm);
  }
  .msg-row.agent .avatar {
    background:#e8f5e9;
    border:1.5px solid #a5d6a7;
  }
  .msg-row.user .avatar {
    background:#e8f0fe;
    border:1.5px solid #bbdefb;
  }
  .bubble-wrap {
    display:flex;
    flex-direction:column;
    gap:.25rem;
    max-width:100%;
  }
  .sender-label {
    font-size:0.75rem;
    color:#617061;
    font-weight:600;
    margin-left:.2rem;
  }
  .msg-row.user .sender-label {
    text-align:right;
    margin-right:.2rem;
  }
  .bubble {
    display:inline-block;
    padding:.75rem 1.05rem;
    border-radius:16px;
    background:var(--agent-bubble-bg);
    border:1px solid var(--agent-bubble-border);
    box-shadow:var(--shadow-sm);
    text-align:left;
    line-height:1.5;
    font-size:0.95rem;
    color:#202820;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .msg-row.agent .bubble {
    border-top-left-radius:4px;
  }
  .msg-row.user .bubble {
    background:var(--user-bubble-bg);
    color:var(--user-bubble-color);
    border:none;
    border-top-right-radius:4px;
    box-shadow:0 2px 4px rgba(46,125,50,0.25);
  }
  /* When the reply is an A2UI card, drop the bubble chrome so the card stands alone. */
  .bubble.rich {
    background:transparent;
    border:none;
    padding:0;
    box-shadow:none;
    max-width:100%;
    white-space:normal;
  }
  form {
    display:flex;
    gap:.6rem;
    padding:.9rem 1.2rem 1.1rem;
    border-top:1px solid var(--border);
    background:#fff;
    box-shadow:0 -2px 6px rgba(0,0,0,0.03);
    max-width:820px;
    width:100%;
    margin:0 auto;
    border-radius:0 0 12px 12px;
  }
  input {
    flex:1;
    padding:.75rem 1rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    font-size:0.95rem;
    background:#fafdff;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus {
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(46,125,50,0.15);
  }
  button {
    padding:.75rem 1.3rem;
    border:none;
    border-radius:12px;
    background:var(--accent);
    color:#fff;
    font-weight:600;
    font-size:0.95rem;
    cursor:pointer;
    box-shadow:var(--shadow-sm);
    transition:background-color .15s ease, transform .1s ease;
  }
  button:hover {
    background:var(--accent-hover);
  }
  button:active {
    transform:scale(0.98);
  }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card {
    border:1px solid #cce0cc;
    border-radius:16px;
    padding:1.15rem;
    background:#ffffff;
    box-shadow:var(--shadow-md);
    max-width:100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top:.6rem; }
  .a2col { display:flex; flex-direction:column; gap:.5rem; }
  .a2row { display:flex; flex-direction:row; gap:.6rem; align-items:center; flex-wrap:wrap; }
  .a2row.between { justify-content:space-between; }
  .a2text { margin:0; line-height:1.45; }
  .a2text.a2-h1 { font-size:1.45rem; font-weight:700; color:#1b431e; }
  .a2text.a2-h2 { font-size:1.25rem; font-weight:700; color:#1b431e; }
  .a2text.a2-h3 { font-size:1.1rem; font-weight:600; color:#224f26; }
  .a2text.a2-h4 { font-size:1rem; font-weight:600; color:#224f26; }
  .a2text.a2-caption { font-size:.85rem; color:#5c6b5c; }
  .a2divider { border:none; border-top:1px solid #e0eae0; margin:.5rem 0; width:100%; }
  .a2img { max-width:100%; border-radius:12px; display:block; box-shadow:var(--shadow-sm); }
  .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-size:1.25rem; line-height:1; vertical-align:middle; color:var(--accent); }

  /* Example prompt chips */
  .prompts-bar {
    display:flex;
    gap:.5rem;
    padding:.6rem 1.2rem 0;
    background:#fff;
    overflow-x:auto;
    max-width:820px;
    width:100%;
    margin:0 auto;
    border-top:1px solid var(--border);
  }
  .prompt-chip {
    background:#eef6ee;
    color:#1e5e22;
    border:1px solid #c2dec2;
    border-radius:20px;
    padding:.45rem .85rem;
    font-size:.83rem;
    font-weight:500;
    cursor:pointer;
    white-space:nowrap;
    transition:background-color .15s ease, border-color .15s ease, transform .1s ease;
  }
  .prompt-chip:hover {
    background:#d8ebd8;
    border-color:#9dc79e;
    transform:translateY(-1px);
  }
</style>
</head>
<body>
<header>🌿 Urban Greenhouse</header>
<div id="log"></div>
<div class="prompts-bar" id="prompts-bar">
  <button type="button" class="prompt-chip" data-prompt="Search for easy beginner plants for low light">🌱 Beginner Low-Light Plants</button>
  <button type="button" class="prompt-chip" data-prompt="Calculate a watering schedule for a 6-inch pot at 72°F in spring">💧 Calculate Watering Schedule</button>
  <button type="button" class="prompt-chip" data-prompt="Generate an image of a Monstera Deliciosa in a sunlit modern living room">📸 Generate Plant Preview</button>
</div>
<form id="form">
  <input id="input" placeholder="Ask about indoor plants, care advice, or watering schedules…" autocomplete="off" autofocus>
  <button>Send</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const row = el("div", "msg-row " + who);
  const avatar = el("div", "avatar", who === "user" ? "🪴" : "🌿");
  const wrap = el("div", "bubble-wrap");
  const label = el("div", "sender-label", who === "user" ? "You" : "Urban Greenhouse");
  const b = el("div", "bubble");
  
  wrap.appendChild(label);
  wrap.appendChild(b);
  row.appendChild(avatar);
  row.appendChild(wrap);
  
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

// A "bound value" is usually {literalString: "..."}; we only support literals.
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

// child ids of a component's props: single `child` and/or `children.explicitList`.
function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

// A2UI icon names are camelCase (locationOn); Material Symbols wants snake_case.
function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;   // missing / cycle guard
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;   // only allow safe URLs
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;   // unknown component -> skipped (text fallback covers content)
  }
}

// Render one or more A2UI messages (beginRendering + surfaceUpdate) into `container`.
// Returns true if anything was drawn.
function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {   // no valid root given -> infer un-referenced components
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

// Fallback: pull every Text value out of the messages as plain text.
function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";   // clear the "…" placeholder
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

// The proxy returns { parts: [{kind:"text",text} | {kind:"a2ui",data}] }.
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    // Read as text first, then parse. If the proxy ever returns a non-JSON error
    // page (e.g. a plain "Internal Server Error"), show that body instead of a
    // cryptic "Unexpected token" JSON error.
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});

// Clickable example prompt chips
document.querySelectorAll(".prompt-chip").forEach((chip) => {
  chip.addEventListener("click", () => {
    const prompt = chip.getAttribute("data-prompt");
    if (prompt) {
      input.value = prompt;
      form.dispatchEvent(new Event("submit", { cancelable: true }));
    }
  });
});
</script>
</body>
</html>
